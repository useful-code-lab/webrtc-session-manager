apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: go-webrtc
data:
  init.sql: |
    -- База уже создана переменной окружения, \c тоже не нужен
    CREATE TABLE IF NOT EXISTS sessions (
        id SERIAL PRIMARY KEY,
        user_id INTEGER,
        active BOOLEAN DEFAULT true
