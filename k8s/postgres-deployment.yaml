apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: go-webrtc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13  # Используем нужную версию PostgreSQL
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_DB
          value: "my_app_db"  # Имя базы данных
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-scripts  # Указываем название volume, который будет смонтирован
          mountPath: /docker-entrypoint-initdb.d  # Монтируем в директорию контейнера
      volumes:
      - name: init-scripts  # Определяем volume, который будет использовать ConfigMap
        configMap:
          name: postgres-init-scripts  # Название ConfigMap с SQL-скриптом