apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-backend
  namespace: go-webrtc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-backend
  template:
    metadata:
      labels:
        app: go-backend
    spec:
      containers:
      - name: go-backend
        image: go-webrtc-backend:latest  # Убедитесь, что у вас актуальный образ
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "postgres"  # Это имя сервиса, к которому приложение подключается
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB